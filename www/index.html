<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roulette LG</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1f2;--surface:#fff;--ink:#2b2b2b;--muted:#6f6a6c;--line:#ddd8da;--red:#a50034;--red-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a1b;--surface:#262426;--ink:#f1eef0;--muted:#a59fa2;--line:#3a373a}}
:root[data-theme="dark"]{--bg:#1b1a1b;--surface:#262426;--ink:#f1eef0;--muted:#a59fa2;--line:#3a373a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.credit{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.credit a{color:inherit}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;flex:none}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}
button{font:inherit;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.ghost:hover{border-color:var(--red)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--red);outline-offset:2px}
.layout{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:860px){.layout{grid-template-columns:1.15fr 1fr;align-items:start}body.client .layout{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.wheelbox{position:relative;width:min(92vw,540px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
.spin{background:var(--red);color:var(--red-ink);border:0;border-radius:999px;padding:16px 56px;font-size:1.3rem;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 0 #6d0022;transition:transform .08s,box-shadow .08s}
.spin:active{transform:translateY(4px);box-shadow:0 2px 0 #6d0022}
.spin:disabled{opacity:.6;cursor:default}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
body.client .editor{display:none}
body.client .wheelbox{width:min(94vw,720px)}
.add{display:grid;gap:10px;grid-template-columns:1fr auto;margin-bottom:6px}
.add input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.photo{display:flex;align-items:center;gap:10px;grid-column:1/-1}
.photo label{border:1px dashed var(--muted);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--muted)}
.photo img{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid var(--red)}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;max-height:46vh;overflow:auto}
li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
li .sw{width:12px;height:36px;border-radius:4px;flex:none}
li img,li .noimg{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg)}
li input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:6px}
li .del{border:0;background:transparent;color:var(--muted);font-size:1.3rem;padding:4px 8px}
li .del:hover{color:var(--red)}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
dialog{border:0;border-radius:18px;padding:0;max-width:min(92vw,420px);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.res{padding:24px;text-align:center}
.res img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:14px}
.res p{margin:0 0 4px;color:var(--muted)}
.res strong{display:block;font-size:1.8rem;line-height:1.15;font-weight:800;margin-bottom:18px}
@media(prefers-reduced-motion:reduce){.spin{transition:none}}
</style>
</head>

  ctx.save();ctx.translate(W/2,W/2);
  ctx.beginPath();ctx.arc(0,0,R+10,0,7);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink')||'#2b2b2b';ctx.fill();
  if(!n){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.fillStyle='#6f6a6c';ctx.font='600 34px sans-serif';ctx.textAlign='center';ctx.fillText('Ajoutez une case',0,10);ctx.restore();return}
  var a=2*Math.PI/n;
  ctx.rotate(rot);
  for(var i=0;i<n;i++){
    var col=colorOf(i);
    if(n>1&&n%COLORS.length===1&&i===n-1)col=COLORS[1];
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*a,(i+1)*a);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.save();ctx.rotate(i*a+a/2);
    var im=getImg(items[i].p),hasP=!!items[i].p;
    var fs=Math.max(18,Math.min(40,R*Math.sin(a/2)*0.62));
    var anchor=hasP?R*0.6:R*0.92;
    ctx.fillStyle=lightBg(col)?'#2b2b2b':'#fff';
    ctx.font='700 '+fs+'px "Bricolage Grotesque",system-ui,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    var t=items[i].t||'',maxW=anchor-R*0.12;
    while(t.length>1&&ctx.measureText(t).width>maxW)t=t.slice(0,-1);
    if(t!==(items[i].t||''))t=t.trim()+'…';
    ctx.fillText(t,anchor,0);
    if(hasP){
      var pr=Math.min(R*0.17,R*0.78*Math.sin(a/2)*0.9);
      ctx.save();ctx.beginPath();ctx.arc(R*0.78,0,pr,0,7);ctx.closePath();
      ctx.fillStyle='#fff';ctx.fill();ctx.clip();
      if(im){
        var s=Math.max(2*pr/im.width,2*pr/im.height);
        ctx.drawImage(im,R*0.78-im.width*s/2,-im.height*s/2,im.width*s,im.height*s);
      }
      ctx.restore();
      ctx.beginPath();ctx.arc(R*0.78,0,pr,0,7);ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
  ctx.save();ctx.translate(W/2,W/2);
  ctx.beginPath();ctx.arc(0,0,66,0,7);ctx.fillStyle='#fff';ctx.fill();
  if(LOGO.complete&&LOGO.naturalWidth)ctx.drawImage(LOGO,-60,-60,120,120);
  ctx.restore();
}

function render(){
  listEl.innerHTML='';
  items.forEach(function(it,i){
    var li=document.createElement('li');
    var sw=document.createElement('span');sw.className='sw';sw.style.background=colorOf(i);li.appendChild(sw);
    if(it.p){var im=document.createElement('img');im.src=it.p;im.alt='';li.appendChild(im)}else{var d=document.createElement('span');d.className='noimg';li.appendChild(d)}
    var inp=document.createElement('input');inp.value=it.t||'';inp.maxLength=40;inp.setAttribute('aria-label','Texte de la case '+(i+1));
    inp.addEventListener('input',function(){items[i].t=inp.value;save();draw()});
    li.appendChild(inp);
    var b=document.createElement('button');b.className='del';b.type='button';b.textContent='×';b.setAttribute('aria-label','Supprimer la case');
    b.addEventListener('click',function(){items.splice(i,1);save();render();draw()});
    li.appendChild(b);listEl.appendChild(li);
  });
  draw();
}

function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var m=320,s=Math.min(1,m/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.8));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
fileEl.addEventListener('change',function(){
  var f=fileEl.files[0];if(!f){pending=null;prev.hidden=true;return}
  shrink(f,function(u){pending=u;prev.src=u;prev.hidden=false});
});
function addItem(){
  var t=txt.value.trim();
  if(!t&&!pending){txt.focus();return}
  items.push({t:t,p:pending||''});
  txt.value='';pending=null;fileEl.value='';prev.hidden=true;
  save();render();txt.focus();
}
document.getElementById('add').addEventListener('click',addItem);
txt.addEventListener('keydown',function(e){if(e.key==='Enter')addItem()});

var dlg=document.getElementById('dlg');
document.getElementById('ok').addEventListener('click',function(){dlg.close()});
function ease(t){return 1-Math.pow(1-t,4)}
function spin(){
  if(spinning||!items.length)return;
  spinning=true;var btn=document.getElementById('spin');btn.disabled=true;
  var n=items.length,a=2*Math.PI/n;
  var start=rot,total=6*2*Math.PI+Math.random()*2*Math.PI;
  var dur=4*total/0.03,t0=performance.now();
  (function step(now){
    var k=Math.min(1,(now-t0)/dur);
    rot=start+total*ease(k);draw();
    if(k<1){requestAnimationFrame(step);return}
    spinning=false;btn.disabled=false;
    var ang=((-Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
    var w=items[Math.floor(ang/a)%n];
    document.getElementById('rtxt').textContent=w.t||'Surprise';
    var ri=document.getElementById('rimg');
    if(w.p){ri.src=w.p;ri.hidden=false}else{ri.hidden=true}
    dlg.showModal();
  })(t0);
}
document.getElementById('spin').addEventListener('click',spin);
var modeBtn=document.getElementById('mode');
modeBtn.addEventListener('click',function(){
  var c=document.body.classList.toggle('client');
  modeBtn.textContent=c?'Modifier les cases':'Terminer';
});
load();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
})();
</script>
